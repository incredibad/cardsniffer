services:
  app:
    container_name: cardsniffer
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - cardsniffer_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      # Default display/log timezone (e.g. Australia/Sydney) — only takes
      # effect until an admin sets one in Settings → Admin → System, which
      # then wins from then on regardless of this value. Also sets the
      # container's own local time, so log rotation timing matches it too.
      - TZ=${TZ:-UTC}
      # Optional default VPN/HTTP proxy for scraper requests (e.g.
      # http://host.docker.internal:8888 for an existing external gluetun
      # like tightarse-gluetun, or http://gluetun:8888 if you uncomment the
      # sidecar service below) — only takes effect until an admin sets one
      # in Settings → Admin → Network, which then wins from then on
      # regardless of this value. Leave unset for no proxy.
      - VPN_PROXY_URL=${VPN_PROXY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6870:6870"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6870/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Optional self-contained VPN sidecar for a fresh install with no existing
  # proxy to point at (this host already has one — tightarse-gluetun — so
  # it stays commented out here). Uncomment, fill in VPN_SERVICE_PROVIDER and
  # your provider's auth vars below (see
  # https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers for the
  # exact vars per provider), then set VPN_PROXY_URL=http://gluetun:8888 in
  # .env so cardsniffer picks it up automatically on first boot.
  # gluetun:
  #   container_name: cardsniffer-gluetun
  #   image: qmcgaw/gluetun
  #   cap_add:
  #     - NET_ADMIN
  #   env_file:
  #     - .env
  #   environment:
  #     - VPN_SERVICE_PROVIDER=changeme
  #     - SERVER_COUNTRIES=changeme
  #     - HTTPPROXY=on
  #   ports:
  #     - "8888:8888"
  #   restart: unless-stopped

volumes:
  cardsniffer_data:
    name: cardsniffer_data
