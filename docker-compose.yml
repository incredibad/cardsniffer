services:
  app:
    container_name: cardsniffer
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - cardsniffer_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      # Default display/log timezone (e.g. Australia/Sydney) — only takes
      # effect until an admin sets one in Settings → Admin → System, which
      # then wins from then on regardless of this value. Also sets the
      # container's own local time, so log rotation timing matches it too.
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6870:6870"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6870/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  cardsniffer_data:
    name: cardsniffer_data
